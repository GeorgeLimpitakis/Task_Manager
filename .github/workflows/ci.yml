name: Task Management API CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Fix Directory Permissions
      # Δίνουμε δικαιώματα στο src για να μπορεί η PHP να φτιάξει τη βάση δεδομένων
      run: chmod -R 777 src/

    - name: Start Application and Run Tests
      # Χρησιμοποιούμε το δικό σου docker-compose που τα κάνει όλα αυτόματα
      run: |
        docker compose up --build --abort-on-container-exit

    - name: Show System Logs on Failure
      # Αν αποτύχει, δείξε μας τι έγραψε η PHP και η Python
      if: failure()
      run: docker compose logs
